[package]
name = "sap-rs"
version = "0.9.0"
edition = "2024"
authors = ["Michael Bachmann <mbachmann@bbmsoft.net>"]
description = "A pure Rust implementation of the Session Announcement Protocol"
repository = "https://github.com/babymotte/sap-rs"
license = "AGPL-3.0-or-later"
keywords = ["sap", "sdp", "audio", "video"]
categories = ["multimedia", "network-programming"]

[dependencies]
if-addrs = "0.15.0"
lazy_static = "1.5.0"
miette = "7.2.0"
murmur3 = "0.5.2"
sdp = "0.17.1"
socket2 = "0.6.3"
thiserror = "2.0.18"
tokio = { version = "1.52.0", features = [
    "macros",
    "net",
    "rt",
    "sync",
    "time",
] }
tosub = "1.1.1"
tracing = "0.1.41"

[dev-dependencies]
miette = { version = "7.2.0", features = ["fancy"] }
tokio = { version = "1.52.0", features = ["fs"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
worterbuch-client = "1.5.0-alpha.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
enum_glob_use = "deny"
# pedantic = "deny"
# nursery = "deny"
unwrap_used = "deny"
