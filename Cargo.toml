[package]
name = "sap-rs"
version = "0.7.0"
edition = "2021"
authors = ["Michael Bachmann <mbachmann@bbmsoft.net>"]
description = "A pure Rust implementation of the Session Announcement Protocol"
repository = "https://github.com/babymotte/sap-rs"
license = "AGPL-3.0-or-later"
keywords = ["sap", "sdp", "audio", "video"]
categories = ["multimedia", "network-programming"]

[dependencies]
lazy_static = "1.5.0"
miette = "7.2.0"
murmur3 = "0.5.2"
sdp = "0.10.0"
socket2 = "0.6.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = [
    "macros",
    "net",
    "rt",
    "sync",
    "time",
] }
tosub = "1.0.0-rc.1"
tracing = "0.1.41"

[dev-dependencies]
miette = { version = "7.2.0", features = ["fancy"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
worterbuch-client = "1.3.8"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
enum_glob_use = "deny"
# pedantic = "deny"
# nursery = "deny"
unwrap_used = "deny"
